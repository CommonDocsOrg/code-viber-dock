&lt;button data-view=&quot;dock&quot; class=&quot;wd-sub&quot;&gt;&lt;span class=&quot;wd-dot&quot;&gt;&lt;/span&gt;Main dock&lt;/button&gt;

&lt;button data-view=&quot;folders&quot; class=&quot;wd-sub wd-secondary&quot;&gt;&lt;i data-lucide=&quot;folder&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Downloads&lt;/button&gt;

&lt;script&gt;
(()=&gt;{const root=document.getElementById(&#x27;wd-concept&#x27;), main=root.querySelector(&#x27;#wd-main&#x27;);
const saved=window.openai?.widgetState?.modelContent;
const st={view:&#x27;overview&#x27;,tab:&#x27;Items&#x27;,item:&#x27;Weather&#x27;,itemTab:&#x27;Content&#x27;,size:48,theme:&#x27;Follow app default&#x27;,units:&#x27;Fahrenheit&#x27;,location:&#x27;Denver, Colorado&#x27;,hide:&#x27;When a window overlaps&#x27;,category:&#x27;All&#x27;,template:null,items:[&#x27;Files&#x27;,&#x27;Browser&#x27;,&#x27;Notes&#x27;,&#x27;Running apps&#x27;,&#x27;Weather&#x27;,&#x27;Clock&#x27;],added:[],...saved};
const design={accent:&#x27;#5b7cda&#x27;,rounding:9};let history=[],notice=&#x27;Concept preview · Changes stay in this preview&#x27;;
const icons={Files:&#x27;folder&#x27;,Browser:&#x27;globe&#x27;,Notes:&#x27;notebook-pen&#x27;,&#x27;Running apps&#x27;:&#x27;app-window&#x27;,Weather:&#x27;cloud-sun&#x27;,Clock:&#x27;clock-3&#x27;};
const ico=n=&gt;`&lt;i data-lucide=&quot;${n}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
const esc=x=&gt;String(x).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
function persist(){window.openai?.setWidgetState?.({modelContent:{...st},privateContent:null})?.catch(()=&gt;{});}
function change(fn,msg){history.push(JSON.stringify(st));fn();notice=msg||&#x27;Saved in preview&#x27;;persist();render();}
function head(crumb,title,sub,action=&#x27;&#x27;){return `&lt;div class=&quot;wd-eyebrow&quot;&gt;${crumb}&lt;/div&gt;&lt;div class=&quot;wd-heading&quot;&gt;&lt;div&gt;&lt;h1&gt;${title}&lt;/h1&gt;&lt;p&gt;${sub}&lt;/p&gt;&lt;/div&gt;${action}&lt;/div&gt;`;}
function footer(){return `&lt;footer class=&quot;wd-footer&quot;&gt;&lt;span role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;${esc(notice)}&lt;/span&gt;&lt;div class=&quot;wd-actions&quot;&gt;&lt;button data-action=&quot;undo&quot; ${history.length?&#x27;&#x27;:&#x27;disabled&#x27;}&gt;↶ Undo&lt;/button&gt;&lt;button data-action=&quot;done&quot; class=&quot;primary&quot;&gt;Done&lt;/button&gt;&lt;/div&gt;&lt;/footer&gt;`;}
function strip(){return `&lt;div class=&quot;wd-preview&quot;&gt;&lt;div class=&quot;wd-preview-title&quot;&gt;Main dock · Live preview&lt;/div&gt;&lt;div class=&quot;wd-strip&quot;&gt;${[...st.items,...st.added].map((n,i)=&gt;`&lt;button class=&quot;wd-slot ${st.item===n?&#x27;selected&#x27;:&#x27;&#x27;}&quot; data-item=&quot;${esc(n)}&quot; aria-label=&quot;Configure ${esc(n)}&quot; aria-pressed=&quot;${st.item===n}&quot; style=&quot;width:${Math.max(35,st.size*.85)}px&quot;&gt;${n===&#x27;Weather&#x27;?&#x27;&lt;span class=&quot;wd-weather&quot;&gt;☀ &#x27;+(st.units===&#x27;Celsius&#x27;?&#x27;18°&#x27;:&#x27;64°&#x27;)+&#x27;&lt;/span&gt;&#x27;:n===&#x27;Clock&#x27;?&#x27;&lt;span class=&quot;wd-clock&quot;&gt;10:42&lt;small&gt;&lt;br&gt;Sunday&lt;/small&gt;&lt;/span&gt;&#x27;:ico(icons[n]||&#x27;layout-grid&#x27;)}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`;}
function field(label,control,hint=&#x27;&#x27;){return `&lt;div class=&quot;wd-field&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;${control}${hint?`&lt;small&gt;${hint}&lt;/small&gt;`:&#x27;&#x27;}&lt;/div&gt;`;}
function select(id,opts,value){return `&lt;select aria-label=&quot;${id}&quot; data-setting=&quot;${id}&quot;&gt;${opts.map(n=&gt;`&lt;option ${n===value?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${esc(n)}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;`;}
function toggle(label,on=true){return `&lt;label class=&quot;wd-fieldline&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;input type=&quot;checkbox&quot; ${on?&#x27;checked&#x27;:&#x27;&#x27;} data-toggle=&quot;${label}&quot;&gt;&lt;/label&gt;`;}
function inspector(){let weather=st.item===&#x27;Weather&#x27;;return `&lt;div class=&quot;wd-inspector&quot;&gt;&lt;div class=&quot;wd-actions&quot; style=&quot;justify-content:space-between&quot;&gt;&lt;div&gt;&lt;h2 class=&quot;wd-icon&quot;&gt;${ico(icons[st.item]||&#x27;layout-grid&#x27;)}${esc(st.item)}&lt;/h2&gt;&lt;p&gt;${weather?&#x27;Denver · This widget only&#x27;:&#x27;Main dock · This item only&#x27;}&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;quiet&quot; data-action=&quot;remove-item&quot; aria-label=&quot;Remove selected item&quot;&gt;${ico(&#x27;trash-2&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;wd-mini-tabs&quot;&gt;${[&#x27;Content&#x27;,&#x27;Appearance&#x27;,&#x27;Position&#x27;].map(t=&gt;`&lt;button data-itemtab=&quot;${t}&quot; class=&quot;${st.itemTab===t?&#x27;active&#x27;:&#x27;&#x27;}&quot;&gt;${t}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${st.itemTab===&#x27;Content&#x27;?(weather?`${field(&#x27;Location&#x27;,`&lt;input aria-label=&quot;Location&quot; data-setting=&quot;location&quot; value=&quot;${esc(st.location)}&quot;&gt;`,&#x27;Custom location · Only used by this weather widget&#x27;)}&lt;button class=&quot;quiet&quot; data-action=&quot;shared-location&quot;&gt;↶ Use shared location&lt;/button&gt;${field(&#x27;Temperature&#x27;,select(&#x27;units&#x27;,[&#x27;Fahrenheit&#x27;,&#x27;Celsius&#x27;],st.units))}${toggle(&#x27;Show condition label&#x27;,true)}`:st.item===&#x27;Clock&#x27;?`${field(&#x27;Time zone&#x27;,select(&#x27;timezone&#x27;,[&#x27;Local time&#x27;,&#x27;Tokyo&#x27;,&#x27;London&#x27;],&#x27;Local time&#x27;))}${toggle(&#x27;Show date&#x27;)}${toggle(&#x27;Use 24-hour time&#x27;,false)}`:st.item===&#x27;Running apps&#x27;?`${field(&#x27;Show apps from&#x27;,select(&#x27;apps&#x27;,[&#x27;This display&#x27;,&#x27;All displays&#x27;],&#x27;This display&#x27;))}${field(&#x27;Order&#x27;,select(&#x27;order&#x27;,[&#x27;Recently opened&#x27;,&#x27;App name&#x27;],&#x27;Recently opened&#x27;))}`:`${field(&#x27;Display name&#x27;,`&lt;input aria-label=&quot;Item name&quot; value=&quot;${esc(st.item)}&quot; data-setting=&quot;itemname&quot;&gt;`)}${toggle(&#x27;Show running indicator&#x27;)}`):st.itemTab===&#x27;Appearance&#x27;?`${field(&#x27;Style&#x27;,select(&#x27;style&#x27;,weather?[&#x27;Icon and temperature&#x27;,&#x27;Temperature only&#x27;,&#x27;Forecast&#x27;]:[&#x27;Use dock style&#x27;,&#x27;Minimal&#x27;,&#x27;Detailed&#x27;],&#x27;Icon and temperature&#x27;))}${toggle(&#x27;Follow dock colors&#x27;)}${field(&#x27;Text size&#x27;,select(&#x27;textsize&#x27;,[&#x27;Small&#x27;,&#x27;Medium&#x27;,&#x27;Large&#x27;],&#x27;Medium&#x27;))}`:`${field(&#x27;Dock section&#x27;,select(&#x27;section&#x27;,[&#x27;Start&#x27;,&#x27;Center&#x27;,&#x27;End&#x27;],&#x27;End&#x27;))}&lt;div class=&quot;wd-actions&quot;&gt;&lt;button data-action=&quot;move-left&quot;&gt;← Move earlier&lt;/button&gt;&lt;button data-action=&quot;move-right&quot;&gt;Move later →&lt;/button&gt;&lt;/div&gt;&lt;details&gt;&lt;summary&gt;Exact offset&lt;/summary&gt;${field(&#x27;Offset&#x27;, &#x27;&lt;input aria-label=&quot;Offset&quot; type=&quot;number&quot; value=&quot;0&quot;&gt;&#x27;,&#x27;Measured in DIPs&#x27;)}&lt;/details&gt;`}&lt;details&gt;&lt;summary&gt;Advanced settings&lt;/summary&gt;${weather?field(&#x27;Refresh every&#x27;,select(&#x27;refresh&#x27;,[&#x27;15 minutes&#x27;,&#x27;30 minutes&#x27;,&#x27;60 minutes&#x27;],&#x27;30 minutes&#x27;)):toggle(&#x27;Show label on hover&#x27;)}&lt;/details&gt;&lt;/div&gt;`;}
const catalog=[[&#x27;Weather&#x27;,&#x27;Current conditions and forecast&#x27;,&#x27;cloud-sun&#x27;,&#x27;Clocks &amp; weather&#x27;],[&#x27;Clock&#x27;,&#x27;Time, date, and time zones&#x27;,&#x27;clock-3&#x27;,&#x27;Clocks &amp; weather&#x27;],[&#x27;Volume&#x27;,&#x27;Volume and output devices&#x27;,&#x27;volume-2&#x27;,&#x27;System tools&#x27;],[&#x27;Notes&#x27;,&#x27;Keep a thought close at hand&#x27;,&#x27;notebook-pen&#x27;,&#x27;Widgets&#x27;],[&#x27;Folder&#x27;,&#x27;A shortcut to your files&#x27;,&#x27;folder&#x27;,&#x27;Apps &amp; folders&#x27;],[&#x27;System monitor&#x27;,&#x27;CPU, memory, and network&#x27;,&#x27;activity&#x27;,&#x27;Widgets&#x27;]];
function render(){root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(b=&gt;{b.classList.toggle(&#x27;active&#x27;,b.dataset.view===st.view);if(b.dataset.view===st.view)b.setAttribute(&#x27;aria-current&#x27;,&#x27;page&#x27;);else b.removeAttribute(&#x27;aria-current&#x27;);});
let out=&#x27;&#x27;;
if(st.view===&#x27;overview&#x27;){out=head(&#x27;Your desktop&#x27;,&#x27;A place for everything.&#x27;,&#x27;Arrange your docks, widgets, and folder panels.&#x27;,`&lt;button class=&quot;primary&quot; data-view=&quot;library&quot;&gt;+ Add to desktop&lt;/button&gt;`)+`&lt;section class=&quot;wd-box&quot;&gt;&lt;div class=&quot;wd-actions&quot; style=&quot;justify-content:space-between&quot;&gt;&lt;h2&gt;Displays and placement&lt;/h2&gt;&lt;span class=&quot;wd-status&quot;&gt;2 displays connected&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;wd-display-map&quot; aria-label=&quot;Two displays with Main dock on display 1 and Work dock on display 2&quot;&gt;&lt;div class=&quot;wd-monitor&quot;&gt;&lt;span class=&quot;wd-monitor-label&quot;&gt;1 · Primary display&lt;/span&gt;&lt;span class=&quot;wd-float&quot;&gt;☀ 64°&lt;/span&gt;&lt;button data-view=&quot;dock&quot;&gt;▦ Main dock&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;wd-monitor small&quot;&gt;&lt;span class=&quot;wd-monitor-label&quot;&gt;2 · Extended&lt;/span&gt;&lt;button data-action=&quot;work&quot;&gt;▦ Work dock&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Select an object below to customize it, or edit its placement.&lt;/p&gt;&lt;/section&gt;&lt;h2&gt;Your desktop objects&lt;/h2&gt;${[[&#x27;Main dock&#x27;,&#x27;Bottom · Display 1 · 6 items&#x27;,&#x27;panels-top-left&#x27;,&#x27;dock&#x27;],[&#x27;Weather&#x27;,&#x27;Main dock · Denver&#x27;,&#x27;cloud-sun&#x27;,&#x27;weather&#x27;],[&#x27;Downloads&#x27;,&#x27;Folder panel · Display 1&#x27;,&#x27;folder&#x27;,&#x27;folders&#x27;]].map(([n,d,i,v])=&gt;`&lt;div class=&quot;wd-listrow&quot;&gt;&lt;span class=&quot;wd-object-icon&quot;&gt;${ico(i)}&lt;/span&gt;&lt;div&gt;&lt;strong&gt;${n}&lt;/strong&gt;&lt;p&gt;${d}&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;wd-status&quot;&gt;Visible&lt;/span&gt;&lt;button data-view=&quot;${v}&quot;&gt;Customize →&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}`;}
else if(st.view===&#x27;dock&#x27;||st.view===&#x27;weather&#x27;){if(st.view===&#x27;weather&#x27;){st.tab=&#x27;Items&#x27;;st.item=&#x27;Weather&#x27;;}out=head(&#x27;Your desktop › Main dock&#x27;+(st.view===&#x27;weather&#x27;?&#x27; › Weather&#x27;:&#x27;&#x27;),st.view===&#x27;weather&#x27;?&#x27;Weather&#x27;:&#x27;Main dock&#x27;,st.view===&#x27;weather&#x27;?&#x27;Customize this instance without leaving your workspace.&#x27;:&#x27;Bottom edge · Display 1 · Changes affect this dock only.&#x27;,`&lt;button data-action=&quot;identify&quot; class=&quot;quiet wd-icon&quot;&gt;${ico(&#x27;scan&#x27;)}Identify on screen&lt;/button&gt;`)+`&lt;div class=&quot;wd-tabs&quot; aria-label=&quot;Dock sections&quot;&gt;${[&#x27;Items&#x27;,&#x27;Appearance&#x27;,&#x27;Placement&#x27;,&#x27;Behavior&#x27;].map(t=&gt;`&lt;button data-tab=&quot;${t}&quot; class=&quot;${st.tab===t?&#x27;active&#x27;:&#x27;&#x27;}&quot; aria-pressed=&quot;${st.tab===t}&quot;&gt;${t}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`+strip();
if(st.tab===&#x27;Items&#x27;)out+=`&lt;div class=&quot;wd-split&quot;&gt;${inspector()}&lt;aside class=&quot;wd-library-mini&quot;&gt;&lt;h2&gt;Add an item&lt;/h2&gt;&lt;p&gt;Pick an item to add to this dock.&lt;/p&gt;${catalog.slice(0,4).map(([n,d,i])=&gt;`&lt;button data-add=&quot;${n}&quot;&gt;${ico(i)}${n}&lt;span style=&quot;margin-left:auto&quot;&gt;+&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;button class=&quot;quiet&quot; data-view=&quot;library&quot;&gt;Browse all items →&lt;/button&gt;&lt;/aside&gt;&lt;/div&gt;`;
if(st.tab===&#x27;Appearance&#x27;)out+=`&lt;section class=&quot;wd-box&quot;&gt;&lt;h2&gt;Theme and size&lt;/h2&gt;${field(&#x27;Theme&#x27;,select(&#x27;theme&#x27;,[&#x27;Follow app default&#x27;,&#x27;Glass&#x27;,&#x27;Solid&#x27;,&#x27;High contrast&#x27;],st.theme),st.theme===&#x27;Follow app default&#x27;?&#x27;Following app theme · Dark&#x27;:&#x27;Custom theme · App theme changes will not affect this dock&#x27;)}&lt;div class=&quot;wd-themechoices&quot;&gt;${[&#x27;Glass&#x27;,&#x27;Solid&#x27;,&#x27;High contrast&#x27;].map((n,i)=&gt;`&lt;button data-theme=&quot;${n}&quot; class=&quot;${st.theme===n?&#x27;active&#x27;:&#x27;&#x27;}&quot;&gt;&lt;span class=&quot;wd-swatch ${i===0?&#x27;glass&#x27;:i===2?&#x27;contrast&#x27;:&#x27;&#x27;}&quot;&gt;&lt;/span&gt;${n}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${field(`Icon size &lt;span style=&quot;float:right&quot;&gt;${st.size} DIP&lt;/span&gt;`,`&lt;input type=&quot;range&quot; min=&quot;32&quot; max=&quot;64&quot; step=&quot;4&quot; value=&quot;${st.size}&quot; data-setting=&quot;size&quot; aria-label=&quot;Icon size&quot;&gt;`)}${field(&#x27;Magnification&#x27;,select(&#x27;magnification&#x27;,[&#x27;Off&#x27;,&#x27;Subtle · 1.3×&#x27;,&#x27;Classic · 1.6×&#x27;],&#x27;Subtle · 1.3×&#x27;))}${toggle(&#x27;Show app names on hover&#x27;)}&lt;details&gt;&lt;summary&gt;Colors, spacing, and effects&lt;/summary&gt;${field(&#x27;Icon spacing&#x27;,select(&#x27;spacing&#x27;,[&#x27;Compact&#x27;,&#x27;Comfortable&#x27;,&#x27;Spacious&#x27;],&#x27;Comfortable&#x27;))}${toggle(&#x27;Background blur&#x27;)}&lt;/details&gt;&lt;/section&gt;`;
if(st.tab===&#x27;Placement&#x27;)out+=`&lt;section class=&quot;wd-box&quot;&gt;&lt;h2&gt;Where your dock lives&lt;/h2&gt;${field(&#x27;Display&#x27;,select(&#x27;display&#x27;,[&#x27;Display 1 · Primary&#x27;,&#x27;Display 2 · Extended&#x27;],&#x27;Display 1 · Primary&#x27;))}${field(&#x27;Shape&#x27;,select(&#x27;shape&#x27;,[&#x27;Bar on an edge&#x27;,&#x27;Floating bar&#x27;,&#x27;Half circle&#x27;,&#x27;Circle&#x27;],&#x27;Bar on an edge&#x27;))}${field(&#x27;Screen edge&#x27;,select(&#x27;edge&#x27;,[&#x27;Bottom&#x27;,&#x27;Top&#x27;,&#x27;Left&#x27;,&#x27;Right&#x27;],&#x27;Bottom&#x27;))}${field(&#x27;Alignment&#x27;,select(&#x27;alignment&#x27;,[&#x27;Start&#x27;,&#x27;Center&#x27;,&#x27;End&#x27;],&#x27;Center&#x27;))}${toggle(&#x27;Span the full edge&#x27;,false)}${toggle(&#x27;Keep maximized windows clear&#x27;,false)}&lt;details&gt;&lt;summary&gt;Exact position and desktop layer&lt;/summary&gt;${field(&#x27;Layer&#x27;,select(&#x27;layer&#x27;,[&#x27;Above windows&#x27;,&#x27;On the desktop&#x27;,&#x27;Under all windows&#x27;],&#x27;Above windows&#x27;))}&lt;/details&gt;&lt;/section&gt;`;
