function setups(){return `&lt;h2&gt;Save it. Try something new. Come back anytime.&lt;/h2&gt;&lt;p&gt;Looks change appearance. Dock setups also change items and behavior.&lt;/p&gt;&lt;div class=&quot;di-saveform&quot;&gt;&lt;input id=&quot;di-save-name&quot; aria-label=&quot;Setup name&quot; value=&quot;${esc(config.name)} · My setup&quot;&gt;&lt;button data-action=&quot;save-setup&quot;&gt;${ico(&#x27;save&#x27;)}Save current dock&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;di-setups&quot;&gt;${[[&#x27;Everyday&#x27;,&#x27;Apps, notes, weather, and a clock.&#x27;],[&#x27;Windows classic&#x27;,&#x27;Square corners and a familiar taskbar.&#x27;],...config.saved.map(s=&gt;[s.name,&#x27;Your saved dock · Items and appearance&#x27;])].map(([n,d])=&gt;`&lt;section class=&quot;di-setup&quot;&gt;&lt;div class=&quot;di-look ${n===&#x27;Everyday&#x27;?&#x27;glass&#x27;:&#x27;square&#x27;}&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;h3 style=&quot;margin-top:10px&quot;&gt;${esc(n)}&lt;/h3&gt;&lt;p&gt;${d}&lt;/p&gt;&lt;button data-preview=&quot;${esc(n)}&quot;&gt;Preview on this dock&lt;/button&gt;&lt;/section&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${preview?`&lt;div class=&quot;di-review&quot;&gt;&lt;h2&gt;Previewing ${esc(preview.name)}&lt;/h2&gt;&lt;p&gt;Your previous arrangement is safe until you choose Keep.&lt;/p&gt;&lt;div class=&quot;di-inline&quot;&gt;&lt;button data-action=&quot;keep&quot; class=&quot;primary&quot;&gt;Keep this setup&lt;/button&gt;&lt;button data-action=&quot;cancel&quot;&gt;Cancel preview&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`:&#x27;&#x27;}`;}
