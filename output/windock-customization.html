<div id="wd-concept" aria-label="WinDock customization concept">
<style>
#wd-concept{--wd-bg:light-dark(#f7f8fa,#191c22);--wd-panel:light-dark(#ffffff,#22262e);--wd-side:light-dark(#eff1f5,#1e222a);--wd-text:light-dark(#202734,#edf1f8);--wd-muted:light-dark(#626d7c,#a4afbf);--wd-line:light-dark(#dde2e9,#363d49);--wd-accent:light-dark(#365dcc,#9eb8ff);--wd-soft:light-dark(#e5ecff,#303e60);--wd-land:light-dark(#dce6ee,#303e50);color:var(--wd-text);font:14px/1.45 'Segoe UI',sans-serif;background:var(--wd-bg);border:1px solid var(--wd-line);border-radius:12px;overflow:hidden;width:100%;box-sizing:border-box}
#wd-concept *{box-sizing:border-box}#wd-concept button,#wd-concept input,#wd-concept select{font:inherit;color:inherit}#wd-concept button{background:var(--wd-panel);border:1px solid var(--wd-line);border-radius:6px;padding:8px 12px;cursor:default}#wd-concept button:hover{background:var(--wd-soft)}#wd-concept button.primary{background:var(--wd-accent);color:light-dark(#fff,#152142);border-color:transparent}#wd-concept button.quiet{background:transparent;border-color:transparent}#wd-concept button.active{background:var(--wd-soft);color:var(--wd-accent)}#wd-concept button:disabled{opacity:.45}#wd-concept input:not([type=checkbox]):not([type=range]),#wd-concept select{background:var(--wd-panel);border:1px solid var(--wd-line);padding:8px 10px;border-radius:6px;max-width:100%;min-width:0}#wd-concept input[type=checkbox],#wd-concept input[type=range]{accent-color:var(--wd-accent)}#wd-concept input[type=range]{width:100%}#wd-concept svg{width:17px;height:17px}#wd-concept .wd-icon{display:inline-flex;align-items:center;gap:8px}#wd-concept .wd-titlebar{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--wd-line);padding-right:100px;flex-wrap:wrap}#wd-concept .wd-brand{font-weight:650;letter-spacing:-.4px;font-size:17px}#wd-concept .wd-concept-label{font-size:11px;letter-spacing:1px;color:var(--wd-muted);text-transform:uppercase}#wd-concept .wd-search{margin-left:auto;width:240px}#wd-concept .wd-shell{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:690px}#wd-concept .wd-sidebar{padding:19px 12px;background:var(--wd-side);border-right:1px solid var(--wd-line)}#wd-concept .wd-navlabel{font-size:10px;font-weight:700;letter-spacing:1.3px;color:var(--wd-muted);margin:18px 10px 7px}#wd-concept .wd-navlabel:first-child{margin-top:2px}#wd-concept .wd-sidebar button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 11px;margin:2px 0;border:0;background:transparent}#wd-concept .wd-sidebar button.active{background:var(--wd-soft)}#wd-concept .wd-sidebar .wd-sub{padding-left:36px;font-size:13px}#wd-concept .wd-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--wd-accent);flex-shrink:0}#wd-concept .wd-main{min-width:0;padding:25px 27px 18px}#wd-concept h1{font-size:27px;line-height:1.2;letter-spacing:-.7px;margin:0 0 7px;font-weight:650}#wd-concept h2{font-size:15px;margin:0 0 5px;font-weight:650}#wd-concept h3{font-size:13px;margin:0 0 6px}#wd-concept p{margin:4px 0;color:var(--wd-muted);font-size:12px}#wd-concept .wd-eyebrow{font-size:11px;color:var(--wd-muted);margin-bottom:10px}#wd-concept .wd-heading{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap}#wd-concept .wd-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}#wd-concept .wd-box{background:var(--wd-panel);border:1px solid var(--wd-line);border-radius:9px;padding:18px;margin-bottom:15px}#wd-concept .wd-display-map{display:flex;align-items:flex-end;gap:15px;justify-content:center;padding:25px 15px 34px;background:var(--wd-side);border-radius:7px;margin-bottom:18px}#wd-concept .wd-monitor{width:58%;min-height:170px;border:5px solid var(--wd-line);border-radius:7px;background:linear-gradient(145deg,var(--wd-land),var(--wd-bg));padding:10px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between}#wd-concept .wd-monitor.small{width:36%;min-height:137px}#wd-concept .wd-monitor-label{font-size:11px;color:var(--wd-muted)}#wd-concept .wd-monitor button{font-size:11px;padding:5px 12px;background:var(--wd-panel);border-color:var(--wd-accent)}#wd-concept .wd-float{align-self:flex-end;font-size:18px;padding:9px;margin:4px;background:var(--wd-panel);border-radius:7px}#wd-concept .wd-listrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--wd-line)}#wd-concept .wd-listrow:last-child{border-bottom:0;padding-bottom:0}#wd-concept .wd-listrow>div:nth-child(2){flex:1}#wd-concept .wd-object-icon{width:36px;height:36px;display:grid;place-items:center;background:var(--wd-side);border-radius:8px;color:var(--wd-accent)}#wd-concept .wd-listrow strong{font-size:13px}#wd-concept .wd-status{font-size:11px;color:var(--wd-muted)}#wd-concept .wd-tabs{display:flex;gap:20px;border-bottom:1px solid var(--wd-line);margin-bottom:19px;flex-wrap:wrap}#wd-concept .wd-tabs button{border:0;background:transparent;padding:10px 0;border-radius:0;border-bottom:2px solid transparent;color:var(--wd-muted)}#wd-concept .wd-tabs button.active{border-bottom-color:var(--wd-accent);color:var(--wd-text)}#wd-concept .wd-preview{background:linear-gradient(135deg,var(--wd-land),var(--wd-side));border-radius:8px;padding:17px 12px 21px;min-height:143px;margin-bottom:18px}#wd-concept .wd-preview-title{color:var(--wd-muted);font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:18px;text-align:center}#wd-concept .wd-strip{display:flex;justify-content:center;gap:7px;align-items:center;flex-wrap:wrap;width:fit-content;max-width:100%;margin:auto;background:var(--wd-panel);border:1px solid var(--wd-line);border-radius:12px;padding:8px 12px;box-shadow:0 5px 14px #0000000d}#wd-concept .wd-slot{border:1px solid transparent;background:transparent;width:45px;height:47px;padding:4px;border-radius:7px;display:grid;place-items:center}#wd-concept .wd-slot svg{width:25px;height:25px}#wd-concept .wd-slot.selected{background:var(--wd-soft);border-color:var(--wd-accent)}#wd-concept .wd-slot .wd-weather{font-size:15px;color:var(--wd-accent);font-weight:650}#wd-concept .wd-clock{font-size:12px;text-align:center;line-height:1.1}#wd-concept .wd-clock small{font-size:9px;color:var(--wd-muted)}#wd-concept .wd-split{display:grid;grid-template-columns:minmax(0,1fr) 185px;gap:15px}#wd-concept .wd-inspector{padding:17px;background:var(--wd-panel);border:1px solid var(--wd-line);border-radius:8px}#wd-concept .wd-mini-tabs{display:flex;gap:12px;margin:13px 0;border-bottom:1px solid var(--wd-line);flex-wrap:wrap}#wd-concept .wd-mini-tabs button{font-size:12px;border:0;background:transparent;padding:7px 0}#wd-concept .wd-mini-tabs button.active{color:var(--wd-accent);border-bottom:2px solid var(--wd-accent);border-radius:0}#wd-concept .wd-field{display:grid;gap:6px;margin:14px 0;font-size:12px}#wd-concept .wd-field>label,#wd-concept .wd-field>span{font-weight:600}#wd-concept .wd-field small{color:var(--wd-muted);font-size:11px}#wd-concept .wd-fieldline{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:15px 0;font-size:12px}#wd-concept .wd-fieldline>div{flex:1}#wd-concept .wd-fieldline select{max-width:52%}#wd-concept .wd-library-mini{border-left:1px solid var(--wd-line);padding-left:15px}#wd-concept .wd-library-mini button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;margin:7px 0;padding:10px 8px;font-size:12px}#wd-concept .wd-library-mini input{width:100%;margin:9px 0;font-size:12px}#wd-concept .wd-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;padding-top:13px;border-top:1px solid var(--wd-line);font-size:11px;color:var(--wd-muted);flex-wrap:wrap}#wd-concept .wd-footer button{font-size:12px}#wd-concept .wd-tilegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}#wd-concept .wd-tile{background:var(--wd-panel);border:1px solid var(--wd-line);border-radius:9px;padding:16px;min-width:0}#wd-concept .wd-tile-art{height:85px;display:flex;justify-content:center;align-items:center;gap:7px;background:var(--wd-side);border-radius:6px;margin-bottom:13px;font-size:25px;color:var(--wd-accent)}#wd-concept .wd-tile-art svg{width:33px;height:33px}#wd-concept .wd-tile button{margin-top:13px;width:100%;font-size:12px}#wd-concept .wd-chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}#wd-concept .wd-chiprow button{font-size:12px;padding:6px 10px}#wd-concept details{font-size:12px;border-top:1px solid var(--wd-line);padding-top:14px;margin-top:17px}#wd-concept summary{font-weight:600}#wd-concept .wd-themechoices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}#wd-concept .wd-themechoices button{padding:10px;font-size:12px}#wd-concept .wd-swatch{height:35px;border-radius:5px;display:block;margin-bottom:7px;background:var(--wd-side)}#wd-concept .wd-swatch.glass{background:linear-gradient(135deg,var(--wd-land),var(--wd-soft))}#wd-concept .wd-swatch.contrast{background:var(--wd-text);border:4px solid var(--wd-accent)}#wd-concept .wd-notice{background:var(--wd-soft);border-radius:6px;padding:10px 12px;font-size:11px;color:var(--wd-accent);margin:14px 0}#wd-concept .wd-template-review{margin-top:15px}#wd-concept [hidden]{display:none!important}#wd-concept .wd-search-results button{display:block;width:100%;text-align:left;margin:7px 0}#wd-concept .wd-empty{padding:25px;text-align:center;color:var(--wd-muted)}
@media(max-width:760px){#wd-concept .wd-shell{grid-template-columns:160px minmax(0,1fr)}#wd-concept .wd-sidebar{padding:15px 7px}#wd-concept .wd-main{padding:22px 17px}#wd-concept .wd-split{grid-template-columns:1fr}#wd-concept .wd-library-mini{border-left:0;border-top:1px solid var(--wd-line);padding:15px 0 0}#wd-concept .wd-library-mini button{width:auto;display:inline-flex;margin-right:5px}#wd-concept .wd-search{width:180px}#wd-concept .wd-titlebar{padding-right:90px}#wd-concept .wd-monitor{min-height:145px}#wd-concept .wd-monitor.small{min-height:115px}}
@media(max-width:520px){#wd-concept .wd-shell{grid-template-columns:1fr}#wd-concept .wd-sidebar{display:flex;gap:5px;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--wd-line)}#wd-concept .wd-sidebar .wd-navlabel,#wd-concept .wd-sidebar .wd-secondary{display:none}#wd-concept .wd-sidebar button,#wd-concept .wd-sidebar .wd-sub{width:auto;padding:8px 10px;font-size:12px}#wd-concept .wd-sidebar svg,#wd-concept .wd-sidebar .wd-dot{display:none}#wd-concept .wd-main{padding:20px 13px}#wd-concept .wd-titlebar{padding:14px 90px 14px 14px}#wd-concept .wd-search{width:100%;margin:3px 0 0}#wd-concept .wd-tilegrid{grid-template-columns:1fr}#wd-concept .wd-tabs{gap:14px}#wd-concept .wd-listrow{gap:8px;flex-wrap:wrap}#wd-concept .wd-status{display:none}#wd-concept .wd-monitor{min-height:130px}#wd-concept .wd-monitor.small{min-height:105px}#wd-concept .wd-display-map{gap:8px;padding:15px 5px}#wd-concept h1{font-size:24px}#wd-concept .wd-fieldline{flex-wrap:wrap}#wd-concept .wd-fieldline select{max-width:100%}}
</style>
<header class="wd-titlebar"><span class="wd-icon wd-brand"><i data-lucide="panels-top-left" aria-hidden="true"></i>WinDock</span><span class="wd-concept-label">Design concept</span><input class="wd-search" type="search" aria-label="Search settings" placeholder="Search settings…  Ctrl+F"></header>
<div class="wd-shell"><nav class="wd-sidebar" aria-label="Customization navigation">
<div class="wd-navlabel">Your desktop</div>
<button data-view="overview" class="active"><i data-lucide="monitor" aria-hidden="true"></i>Overview</button>
<button data-view="dock" class="wd-sub"><span class="wd-dot"></span>Main dock</button>
<button data-view="weather" class="wd-sub"><i data-lucide="cloud-sun" aria-hidden="true"></i>Weather</button>
<button data-view="folders" class="wd-sub wd-secondary"><i data-lucide="folder" aria-hidden="true"></i>Downloads</button>
<div class="wd-navlabel">Make it yours</div>
<button data-view="library"><i data-lucide="layout-grid" aria-hidden="true"></i>Add items</button>
<button data-view="templates"><i data-lucide="panels-top-left" aria-hidden="true"></i>Dock templates</button>
<div class="wd-navlabel">WinDock</div>
<button data-view="preferences"><i data-lucide="settings-2" aria-hidden="true"></i>App preferences</button>
<button data-view="help" class="wd-secondary"><i data-lucide="circle-help" aria-hidden="true"></i>Help</button>
</nav><main class="wd-main" id="wd-main"></main></div>
<script>
(()=>{const root=document.getElementById('wd-concept'), main=root.querySelector('#wd-main');
const saved=window.openai?.widgetState?.modelContent;
const st={view:'overview',tab:'Items',item:'Weather',itemTab:'Content',size:48,theme:'Follow app default',units:'Fahrenheit',location:'Denver, Colorado',hide:'When a window overlaps',category:'All',template:null,items:['Files','Browser','Notes','Running apps','Weather','Clock'],added:[],...saved};
const design={accent:'#5b7cda',rounding:9};let history=[],notice='Concept preview · Changes stay in this preview';
const icons={Files:'folder',Browser:'globe',Notes:'notebook-pen','Running apps':'app-window',Weather:'cloud-sun',Clock:'clock-3'};
const ico=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){window.openai?.setWidgetState?.({modelContent:{...st},privateContent:null})?.catch(()=>{});}
function change(fn,msg){history.push(JSON.stringify(st));fn();notice=msg||'Saved in preview';persist();render();}
function head(crumb,title,sub,action=''){return `<div class="wd-eyebrow">${crumb}</div><div class="wd-heading"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`;}
function footer(){return `<footer class="wd-footer"><span role="status" aria-live="polite">${esc(notice)}</span><div class="wd-actions"><button data-action="undo" ${history.length?'':'disabled'}>↶ Undo</button><button data-action="done" class="primary">Done</button></div></footer>`;}
function strip(){return `<div class="wd-preview"><div class="wd-preview-title">Main dock · Live preview</div><div class="wd-strip">${[...st.items,...st.added].map((n,i)=>`<button class="wd-slot ${st.item===n?'selected':''}" data-item="${esc(n)}" aria-label="Configure ${esc(n)}" aria-pressed="${st.item===n}" style="width:${Math.max(35,st.size*.85)}px">${n==='Weather'?'<span class="wd-weather">☀ '+(st.units==='Celsius'?'18°':'64°')+'</span>':n==='Clock'?'<span class="wd-clock">10:42<small><br>Sunday</small></span>':ico(icons[n]||'layout-grid')}</button>`).join('')}</div></div>`;}
function field(label,control,hint=''){return `<div class="wd-field"><span>${label}</span>${control}${hint?`<small>${hint}</small>`:''}</div>`;}
function select(id,opts,value){return `<select aria-label="${id}" data-setting="${id}">${opts.map(n=>`<option ${n===value?'selected':''}>${esc(n)}</option>`).join('')}</select>`;}
function toggle(label,on=true){return `<label class="wd-fieldline"><span>${label}</span><input type="checkbox" ${on?'checked':''} data-toggle="${label}"></label>`;}
function inspector(){let weather=st.item==='Weather';return `<div class="wd-inspector"><div class="wd-actions" style="justify-content:space-between"><div><h2 class="wd-icon">${ico(icons[st.item]||'layout-grid')}${esc(st.item)}</h2><p>${weather?'Denver · This widget only':'Main dock · This item only'}</p></div><button class="quiet" data-action="remove-item" aria-label="Remove selected item">${ico('trash-2')}</button></div><div class="wd-mini-tabs">${['Content','Appearance','Position'].map(t=>`<button data-itemtab="${t}" class="${st.itemTab===t?'active':''}">${t}</button>`).join('')}</div>${st.itemTab==='Content'?(weather?`${field('Location',`<input aria-label="Location" data-setting="location" value="${esc(st.location)}">`,'Custom location · Only used by this weather widget')}<button class="quiet" data-action="shared-location">↶ Use shared location</button>${field('Temperature',select('units',['Fahrenheit','Celsius'],st.units))}${toggle('Show condition label',true)}`:st.item==='Clock'?`${field('Time zone',select('timezone',['Local time','Tokyo','London'],'Local time'))}${toggle('Show date')}${toggle('Use 24-hour time',false)}`:st.item==='Running apps'?`${field('Show apps from',select('apps',['This display','All displays'],'This display'))}${field('Order',select('order',['Recently opened','App name'],'Recently opened'))}`:`${field('Display name',`<input aria-label="Item name" value="${esc(st.item)}" data-setting="itemname">`)}${toggle('Show running indicator')}`):st.itemTab==='Appearance'?`${field('Style',select('style',weather?['Icon and temperature','Temperature only','Forecast']:['Use dock style','Minimal','Detailed'],'Icon and temperature'))}${toggle('Follow dock colors')}${field('Text size',select('textsize',['Small','Medium','Large'],'Medium'))}`:`${field('Dock section',select('section',['Start','Center','End'],'End'))}<div class="wd-actions"><button data-action="move-left">← Move earlier</button><button data-action="move-right">Move later →</button></div><details><summary>Exact offset</summary>${field('Offset', '<input aria-label="Offset" type="number" value="0">','Measured in DIPs')}</details>`}<details><summary>Advanced settings</summary>${weather?field('Refresh every',select('refresh',['15 minutes','30 minutes','60 minutes'],'30 minutes')):toggle('Show label on hover')}</details></div>`;}
const catalog=[['Weather','Current conditions and forecast','cloud-sun','Clocks & weather'],['Clock','Time, date, and time zones','clock-3','Clocks & weather'],['Volume','Volume and output devices','volume-2','System tools'],['Notes','Keep a thought close at hand','notebook-pen','Widgets'],['Folder','A shortcut to your files','folder','Apps & folders'],['System monitor','CPU, memory, and network','activity','Widgets']];
function render(){root.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===st.view);if(b.dataset.view===st.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
let out='';
if(st.view==='overview'){out=head('Your desktop','A place for everything.','Arrange your docks, widgets, and folder panels.',`<button class="primary" data-view="library">+ Add to desktop</button>`)+`<section class="wd-box"><div class="wd-actions" style="justify-content:space-between"><h2>Displays and placement</h2><span class="wd-status">2 displays connected</span></div><div class="wd-display-map" aria-label="Two displays with Main dock on display 1 and Work dock on display 2"><div class="wd-monitor"><span class="wd-monitor-label">1 · Primary display</span><span class="wd-float">☀ 64°</span><button data-view="dock">▦ Main dock</button></div><div class="wd-monitor small"><span class="wd-monitor-label">2 · Extended</span><button data-action="work">▦ Work dock</button></div></div><p>Select an object below to customize it, or edit its placement.</p></section><h2>Your desktop objects</h2>${[['Main dock','Bottom · Display 1 · 6 items','panels-top-left','dock'],['Weather','Main dock · Denver','cloud-sun','weather'],['Downloads','Folder panel · Display 1','folder','folders']].map(([n,d,i,v])=>`<div class="wd-listrow"><span class="wd-object-icon">${ico(i)}</span><div><strong>${n}</strong><p>${d}</p></div><span class="wd-status">Visible</span><button data-view="${v}">Customize →</button></div>`).join('')}`;}
else if(st.view==='dock'||st.view==='weather'){if(st.view==='weather'){st.tab='Items';st.item='Weather';}out=head('Your desktop › Main dock'+(st.view==='weather'?' › Weather':''),st.view==='weather'?'Weather':'Main dock',st.view==='weather'?'Customize this instance without leaving your workspace.':'Bottom edge · Display 1 · Changes affect this dock only.',`<button data-action="identify" class="quiet wd-icon">${ico('scan')}Identify on screen</button>`)+`<div class="wd-tabs" aria-label="Dock sections">${['Items','Appearance','Placement','Behavior'].map(t=>`<button data-tab="${t}" class="${st.tab===t?'active':''}" aria-pressed="${st.tab===t}">${t}</button>`).join('')}</div>`+strip();
if(st.tab==='Items')out+=`<div class="wd-split">${inspector()}<aside class="wd-library-mini"><h2>Add an item</h2><p>Pick an item to add to this dock.</p>${catalog.slice(0,4).map(([n,d,i])=>`<button data-add="${n}">${ico(i)}${n}<span style="margin-left:auto">+</span></button>`).join('')}<button class="quiet" data-view="library">Browse all items →</button></aside></div>`;
if(st.tab==='Appearance')out+=`<section class="wd-box"><h2>Theme and size</h2>${field('Theme',select('theme',['Follow app default','Glass','Solid','High contrast'],st.theme),st.theme==='Follow app default'?'Following app theme · Dark':'Custom theme · App theme changes will not affect this dock')}<div class="wd-themechoices">${['Glass','Solid','High contrast'].map((n,i)=>`<button data-theme="${n}" class="${st.theme===n?'active':''}"><span class="wd-swatch ${i===0?'glass':i===2?'contrast':''}"></span>${n}</button>`).join('')}</div>${field(`Icon size <span style="float:right">${st.size} DIP</span>`,`<input type="range" min="32" max="64" step="4" value="${st.size}" data-setting="size" aria-label="Icon size">`)}${field('Magnification',select('magnification',['Off','Subtle · 1.3×','Classic · 1.6×'],'Subtle · 1.3×'))}${toggle('Show app names on hover')}<details><summary>Colors, spacing, and effects</summary>${field('Icon spacing',select('spacing',['Compact','Comfortable','Spacious'],'Comfortable'))}${toggle('Background blur')}</details></section>`;
if(st.tab==='Placement')out+=`<section class="wd-box"><h2>Where your dock lives</h2>${field('Display',select('display',['Display 1 · Primary','Display 2 · Extended'],'Display 1 · Primary'))}${field('Shape',select('shape',['Bar on an edge','Floating bar','Half circle','Circle'],'Bar on an edge'))}${field('Screen edge',select('edge',['Bottom','Top','Left','Right'],'Bottom'))}${field('Alignment',select('alignment',['Start','Center','End'],'Center'))}${toggle('Span the full edge',false)}${toggle('Keep maximized windows clear',false)}<details><summary>Exact position and desktop layer</summary>${field('Layer',select('layer',['Above windows','On the desktop','Under all windows'],'Above windows'))}</details></section>`;
if(st.tab==='Behavior')out+=`<section class="wd-box"><h2>Visibility</h2>${field('Hide the dock',select('hide',['Never','When the pointer leaves','When a window overlaps'],st.hide),'Move the pointer to the screen edge to reveal the dock.')}<h2 style="margin-top:22px">Apps and windows</h2>${field('Group windows',select('group',['One icon per app','One icon per window'],'One icon per app'))}${field('Click a running app',select('click',['Activate, then minimize','Always activate'],'Activate, then minimize'))}${toggle('Show window previews')}${toggle('Show notification badges')}<details><summary>Delays and advanced interaction</summary>${field('Reveal delay',select('delay',['Instant','150 ms','300 ms'],'150 ms'))}</details></section>`;
}
else if(st.view==='library'){out=head('Library','A little more you.','Add useful things to your dock or desktop.')+`<div class="wd-chiprow">${['All','Clocks & weather','System tools','Widgets','Apps & folders'].map(c=>`<button data-category="${c}" class="${st.category===c?'active':''}">${c}</button>`).join('')}</div><div class="wd-field">${select('destination',['Main dock','Desktop'],'Main dock')}</div><div class="wd-tilegrid">${catalog.filter(c=>st.category==='All'||c[3]===st.category).map(([n,d,i])=>`<article class="wd-tile"><div class="wd-tile-art">${n==='Weather'?'☀ 64°':n==='Clock'?'10:42':ico(i)}</div><h2>${n}</h2><p>${d}</p><button data-add="${n}">+ Add to <span data-destlabel>Main dock</span></button></article>`).join('')}</div>`;}
else if(st.view==='templates'){out=head('Library','Start with a good fit.','Ready-made docks you can make your own.')+`<div class="wd-tilegrid">${[['Everyday','Your apps, a clock, and a little breathing room.','folder'],['Windows classic','A familiar taskbar with apps and system tools.','app-window'],['Quiet workspace','A minimal dock that stays out of your way.','minus'],['Desktop dashboard','Weather, music, and your system at a glance.','layout-dashboard']].map(([n,d,i])=>`<article class="wd-tile"><div class="wd-tile-art">${ico(i)}${ico('globe')}${ico('clock-3')}</div><h2>${n}</h2><p>${d}</p><button data-template="${n}">Preview template →</button></article>`).join('')}</div>${st.template?`<section class="wd-box wd-template-review"><h2>${esc(st.template)}</h2><p>Creates a new dock on Display 1. Your Main dock stays as it is.</p>${toggle('Copy my pinned apps')}<div class="wd-actions"><button class="primary" data-action="create-template">Create new dock</button><button data-action="cancel-template">Cancel</button></div></section>`:''}`;}
else if(st.view==='preferences'){out=head('WinDock','App preferences','Shared settings for your whole experience.')+`<section class="wd-box"><h2>Startup and Windows</h2>${toggle('Start WinDock when I sign in')}${toggle('Hide the Windows taskbar',false)}<button data-action="taskbar">Show Windows taskbar temporarily</button></section><section class="wd-box"><h2>Motion and accessibility</h2>${field('Reduce motion',select('motion',['Follow Windows','Always','Never'],'Follow Windows'))}${field('Dashboard shortcut','<input aria-label="Dashboard shortcut" value="Win + Shift + D">')}</section><section class="wd-box"><h2>Shared data and services</h2>${field('Default location','<input aria-label="Default location" value="Denver, Colorado">')}<p>Widgets can follow this location or choose one of their own.</p><details><summary>Calendar feeds, notifications, and tray icons</summary>${toggle('Enable calendar reminders',false)}${toggle('Show system tray icons',false)}</details></section>`;}
else if(st.view==='folders'){out=head('Your desktop › Folder panels','Downloads','A folder on your desktop, configured in the same workspace.')+`<section class="wd-box">${field('Folder','<input aria-label="Folder path" value="%USERPROFILE%\\Downloads">')}${field('View',select('folderview',['Grid','List','Automatic'],'Grid'))}${field('Sort by',select('sort',['Name','Newest first','File type'],'Newest first'))}${toggle('Show file names')}${toggle('Transparent background',false)}<details><summary>Placement and desktop organization</summary>${field('Display',select('folderdisplay',['Display 1','Display 2'],'Display 1'))}${toggle('Automatically organize files',false)}</details></section>`;}
else if(st.view==='search'){out=head('Find a setting','Search results',`Results for “${esc(root.querySelector('.wd-search').value)}”`)+`<div class="wd-search-results">${[['Appearance','Icon size','Main dock › Appearance'],['Behavior','Hide the dock','Main dock › Behavior'],['Items','Weather location','Main dock › Items › Weather'],['Placement','Display','Main dock › Placement']].filter(x=>x.join(' ').toLowerCase().includes(root.querySelector('.wd-search').value.toLowerCase())).map(([t,n,p])=>`<button data-result="${t}"><strong>${n}</strong><p>${p}</p></button>`).join('')||'<p class="wd-empty">No matching settings in this concept.</p>'}</div>`;}
else out=head('WinDock','A familiar place to start.','Choose a dock or widget to customize it. Changes can be undone.')+`<section class="wd-box"><h2>Try the key flows</h2><div class="wd-listrow"><div>Choose Main dock, then Appearance to try theme and icon size.</div></div><div class="wd-listrow"><div>Select Weather in the dock preview to edit its content in place.</div></div><div class="wd-listrow"><div>Browse Add items or preview a Dock template.</div></div></section>`;
main.innerHTML=out+footer();const dockStrip=main.querySelector('.wd-strip');if(dockStrip&&st.theme==='Glass'){dockStrip.style.background='var(--wd-soft)';}if(dockStrip&&st.theme==='High contrast'){dockStrip.style.border='2px solid var(--wd-text)';}if(globalThis.lucide)lucide.createIcons();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;const d=b.dataset;
if(d.view){st.view=d.view;notice='Concept preview · Changes stay in this preview';persist();render();}
else if(d.tab){st.view='dock';st.tab=d.tab;persist();render();}
else if(d.item){st.item=d.item;st.tab='Items';st.view='dock';st.itemTab='Content';persist();render();}
else if(d.itemtab){st.itemTab=d.itemtab;persist();render();}
else if(d.category){st.category=d.category;persist();render();}
else if(d.theme)change(()=>{st.theme=d.theme},'Theme changed for Main dock only');
else if(d.add)change(()=>{st.added.push(d.add);st.item=d.add;st.itemTab='Content';st.view='dock';st.tab='Items'},`${d.add} added · Undo to remove`);
else if(d.template){st.template=d.template;render();}
else if(d.result){st.view='dock';st.tab=d.result;root.querySelector('.wd-search').value='';render();}
else if(d.action==='undo'){if(history.length){Object.assign(st,JSON.parse(history.pop()));notice='Last change undone';persist();render();}}
else if(d.action==='shared-location')change(()=>{st.location='Denver, Colorado'},'Weather now follows the shared location');
else if(d.action==='cancel-template'){st.template=null;render();}
else if(d.action==='create-template')change(()=>{st.template=null;st.view='overview'},'New dock created in the concept · Undo available');
else if(d.action==='remove-item')change(()=>{let i=st.added.indexOf(st.item);if(i>=0)st.added.splice(i,1);else st.items=st.items.filter(n=>n!==st.item);st.item=st.items[0]||st.added[0]||'Weather'},'Item removed · Undo available');
else if(d.action==='move-left'||d.action==='move-right')change(()=>{const all=[...st.items,...st.added],i=all.indexOf(st.item),j=i+(d.action==='move-left'?-1:1);if(i>=0&&j>=0&&j<all.length){[all[i],all[j]]=[all[j],all[i]];st.items=all;st.added=[];}},'Item order updated · Undo available');
else{notice=({done:'Preview saved · Continue exploring from the sidebar',identify:'Main dock identified on Display 1',taskbar:'Windows taskbar restore action previewed',work:'Work dock selected on Display 2','move-left':'Item moved one position earlier in the concept','move-right':'Item moved one position later in the concept'})[d.action]||'Preview updated';render();}});
root.addEventListener('change',e=>{const el=e.target;if(el.dataset.setting){const k=el.dataset.setting;if(k==='destination'){root.querySelectorAll('[data-destlabel]').forEach(x=>x.textContent=el.value);return;}change(()=>{st[k]=k==='size'?Number(el.value):el.value},'Saved in preview · Only the selected object changes');}else if(el.dataset.toggle){notice=`${el.dataset.toggle}: ${el.checked?'On':'Off'} · Preview only`;main.querySelector('[role=status]').textContent=notice;}});
root.querySelector('.wd-search').addEventListener('input',()=>{st.view=root.querySelector('.wd-search').value?'search':'overview';render();});
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.modelContent;if(s){Object.assign(st,s);render();}});
render();if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{root.style.setProperty('--wd-accent',design.accent);root.style.borderRadius=design.rounding+'px';}});t.addColorPicker(design,'accent',{label:'Accent color',reference:'--wd-accent'});t.addSlider(design,'rounding',{label:'Window corners',min:0,max:16,unit:'px'});}
})();
</script>
</div>
