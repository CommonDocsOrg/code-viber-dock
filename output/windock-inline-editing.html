<div class="di-desktop"><div class="di-top"><span><i data-lucide="monitor" aria-hidden="true"></i>Desktop · Display 1</span><button data-action="welcome" class="quiet">Quick start</button></div><div class="di-layout" id="di-layout"></div><div class="di-hint" id="di-status" role="status" aria-live="polite"></div></div>
<script>
(()=>{const root=document.getElementById('dock-inline-concept'),layout=root.querySelector('#di-layout'),status=root.querySelector('#di-status');
const catalog=[['Weather','cloud-sun','64°','Forecast at a glance'],['Clock','clock-3','10:42','Time in any city'],['Volume','volume-2',null,'Sound and devices'],['Notes','notebook-pen',null,'A thought close by'],['System monitor','activity',null,'Your PC at a glance'],['Calendar','calendar-days','8','Today and upcoming']];
const initial={name:'Main dock',items:[{id:'files',name:'Files',icon:'folder',zone:'Start'},{id:'browser',name:'Browser',icon:'globe',zone:'Start'},{id:'notes',name:'Notes',icon:'notebook-pen',zone:'Center'},{id:'weather',name:'Weather',icon:'cloud-sun',zone:'End',place:'Denver',units:'Fahrenheit'},{id:'clock',name:'Clock',icon:'clock-3',zone:'End'}],theme:'Glass',scope:'Own theme',tint:'#7891ad',transparency:20,corners:'Round',effects:'Off',size:42,edge:'Bottom',offset:0,gap:12,title:'On hover',titlePlace:'Beside',hide:'When a window overlaps',looks:[],saved:[]};
let config=structuredClone(initial);let ui={editing:true,tab:'Add items',selected:'weather',inspector:'Content',docktab:'Appearance',step:0,quickstart:false,search:'',welcomeRoles:['Everyday'],welcomeTheme:'Glass'};const stored=window.openai?.widgetState;if(stored?.modelContent?.version===2){config={...config,...stored.modelContent.config};Object.assign(ui,stored.privateContent||{});}let undo=[],redo=[],drag=null,preview=null,message='Drag a preview onto the dock. Select a dock item to customize it.';
const ico=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const item=()=>config.items.find(x=>x.id===ui.selected);
function persist(){window.openai?.setWidgetState?.({modelContent:{version:2,config},privateContent:ui})?.catch(()=>{});}
function commit(label,fn){if(preview)return;undo.push({config:structuredClone(config),label});if(undo.length>50)undo.shift();redo=[];fn();message=label+' · Saved in preview';persist();render();}
function opts(key,values,value){return `<select data-set="${key}" aria-label="${key}">${values.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select>`;}
function field(label,control,hint=''){return `<label class="di-field"><span>${label}</span>${control}${hint?`<small>${hint}</small>`:''}</label>`;}
function toggle(key,label,on){return `<label class="di-toggle"><span>${label}</span><input type="checkbox" data-set="${key}" ${on?'checked':''}></label>`;}
function title(){return `<header class="di-panel-head"><span class="di-dot"></span><div class="di-head-info"><h1>${ui.quickstart?'Welcome to WinDock':esc(config.name)}</h1><small>${ui.quickstart?'Your desktop, the way you like it.':'Editing this dock only · Display 1'}</small></div><div class="di-history"><button data-action="undo" aria-label="Undo" ${undo.length&&!preview?'':'disabled'}>${ico('undo-2')}</button><button data-action="redo" aria-label="Redo" ${redo.length&&!preview?'':'disabled'}>${ico('redo-2')}</button><button data-action="done" class="primary" ${preview?'disabled':''}>${ui.quickstart?'Close':'Done'}</button></div></header>`;}
function inspector(){const x=item();if(!x)return `<aside class="di-inspector"><h2>Select an item on the dock</h2><p>Its settings appear here.</p></aside>`;return `<aside class="di-inspector"><div class="di-inspector-title">${ico(x.icon)}<div><h2>${esc(x.name)}</h2><p>Selected on ${esc(config.name)}</p></div></div><div class="di-subtabs">${['Content','Appearance','Position'].map(t=>`<button data-inspector="${t}" class="${ui.inspector===t?'active':''}">${t}</button>`).join('')}</div>${ui.inspector==='Content'?(x.name==='Weather'?`${field('Location',`<input data-set="item.place" aria-label="Weather location" value="${esc(x.place||'Denver')}">`,'Custom location · This widget only')}${field('Temperature',opts('item.units',['Fahrenheit','Celsius'],x.units||'Fahrenheit'))}${toggle('item.condition','Show condition label',x.condition!==false)}`:x.name==='Clock'?`${field('Time zone',opts('item.timezone',['Local time','Tokyo','London'],x.timezone||'Local time'))}${toggle('item.date','Show date',x.date!==false)}${toggle('item.hour24','Use 24-hour time',x.hour24||false)}`:`${field('Display name',`<input data-set="item.name" aria-label="Item display name" value="${esc(x.name)}">`)}${x.name==='Notes'?field('Note','<input data-set="item.note" aria-label="Note text" value="'+esc(x.note||'Remember the little things.')+'">'):toggle('item.label','Show label',x.label!==false)}`):ui.inspector==='Appearance'?`${field('Style',opts('item.style',['Default','Minimal','Detailed'],x.style||'Default'))}${toggle('item.colors','Use dock colors',x.colors!==false)}${field('Text size',opts('item.textSize',['Small','Medium','Large'],x.textSize||'Medium'))}`:`${field('Dock section',opts('item.zone',['Start','Center','End'],x.zone))}<div class="di-inline"><button data-action="earlier">← Earlier</button><button data-action="later">Later →</button></div><small>Or drag the item directly on the dock.</small>`}<details><summary>More settings</summary>${field('Label',`<input aria-label="Widget label" data-set="item.caption" value="${esc(x.caption||'')}">`)}</details><button class="quiet di-remove" data-action="remove">${ico('trash-2')} Remove from dock</button></aside>`;}
function addGrid(){return `<div class="di-two"><section><h2>Add something useful</h2><p>Drag a preview onto the dock, or click to add.</p><input class="di-search" type="search" aria-label="Find widgets" placeholder="Find a widget…" value="${esc(ui.search)}"><div class="di-grid">${catalog.filter(x=>x.join(' ').toLowerCase().includes(ui.search.toLowerCase())).map(([n,i,s,d])=>`<button class="di-tile" draggable="true" data-catalog="${n}" aria-label="Add ${n}"><span class="di-sample">${s||ico(i)}</span><strong>${n}</strong><small>${d}</small></button>`).join('')||'<p>No matching widgets.</p>'}</div><small style="display:block;margin-top:10px">Apps and folders can also be dropped from Explorer.</small></section>${inspector()}</div>`;}
function dockSettings(){let content='';if(ui.docktab==='Appearance')content=`<div class="di-settings-grid"><section><h2>A look of its own</h2><p>Choose a theme, then make it yours.</p>${field('Theme source',opts('scope',['Own theme','Follow app theme'],config.scope))}<div class="di-gallery">${['Glass','Solid','Classic',...config.looks.map(x=>x.name)].map((n,i)=>`<button data-theme="${n}" class="${config.theme===n?'active':''}" ${config.scope!=='Own theme'?'disabled':''}><span class="di-look ${i===0?'glass':i===2?'square':''}"><i></i><i></i><i></i><i></i></span>${n}</button>`).join('')}</div>${field('Icon size · '+config.size+' DIP',`<input type="range" data-set="size" min="32" max="56" step="4" value="${config.size}" aria-label="Icon size">`)}<button data-action="save-theme">Save this look</button></section><section><h2>Quick look</h2><p>Fine-tune this dock without editing hex values.</p>${config.scope!=='Own theme'?'<div class="di-togglescope">Following the app theme. Choose Own theme to customize locally.</div>':''}<fieldset style="border:0;padding:0;margin:0;min-width:0" ${config.scope!=='Own theme'?'disabled':''}>${field('Tint',`<input type="color" data-set="tint" value="${config.tint}" aria-label="Dock tint">`)}${field('Transparency · '+config.transparency+'%',`<input type="range" data-set="transparency" min="0" max="70" value="${config.transparency}" aria-label="Dock transparency">`)}${field('Corners',opts('corners',['Square','Soft','Round'],config.corners))}${field('Icon effects',opts('effects',['Off','Glow','Reflection'],config.effects))}</fieldset><details><summary>All theme values</summary><p>Full per-field colors, borders, labels, indicators, and effects remain available here in the application.</p></details></section></div>`;
if(ui.docktab==='Position')content=`<div class="di-settings-grid"><section><h2>Where this dock sits</h2><p>The editor follows the dock as you move it.</p>${field('Screen edge',opts('edge',['Bottom','Top','Left','Right'],config.edge))}${field('Offset from center · '+config.offset+' DIP',`<input type="range" data-set="offset" min="-60" max="60" step="4" value="${config.offset}" aria-label="Offset from center">`)}${field('Distance from edge · '+config.gap+' DIP',`<input type="range" data-set="gap" min="0" max="48" step="4" value="${config.gap}" aria-label="Distance from edge">`)}</section><section><h2>Item placement</h2><p>Move items freely, or keep them in a section.</p>${field('Selected item section',opts('item.zone',['Start','Center','End'],item()?.zone||'End'))}<div class="di-inline"><button data-action="earlier">← Earlier</button><button data-action="later">Later →</button></div><details><summary>Display, shape, and exact coordinates</summary><p>The native editor will include display selection, floating/ring placement, and reserve-space controls here.</p></details></section></div>`;
if(ui.docktab==='Behavior')content=`<div class="di-settings-grid"><section><h2>When it appears</h2><p>Auto-hide pauses while you customize.</p>${field('Hide the dock',opts('hide',['Never','When the pointer leaves','When a window overlaps'],config.hide))}${toggle('previews','Show window previews',config.previews!==false)}${toggle('badges','Show notification badges',config.badges!==false)}</section><section><h2>Apps and windows</h2><p>Choose how the dock responds to you.</p>${field('Group windows',opts('group',['One icon per app','One icon per window'],config.group||'One icon per app'))}${field('Click a running app',opts('click',['Activate, then minimize','Always activate'],config.click||'Activate, then minimize'))}<details><summary>Delays and advanced interaction</summary>${field('Reveal delay',opts('delay',['Instant','150 ms','300 ms'],config.delay||'150 ms'))}</details></section></div>`;
if(ui.docktab==='Identity')content=`<div class="di-settings-grid"><section><h2>Give it a name</h2><p>A name helps you tell your docks apart.</p>${field('Dock name',`<input data-set="name" aria-label="Dock name" value="${esc(config.name)}">`)}${field('Show title',opts('title',['Never','Always','On hover'],config.title))}${field('Title placement',opts('titlePlace',['Beside','Above contents'],config.titlePlace))}</section><section><h2>Keep this setup</h2><p>Save your arrangement before trying another.</p><div class="di-inline"><button data-action="open-save">${ico('save')}Save dock setup</button></div><small style="display:block;margin-top:12px">Rename changes the display name. Your dock keeps its internal identity.</small></section></div>`;
return `<div class="di-subtabs" style="margin-top:0">${['Appearance','Position','Behavior','Identity'].map(t=>`<button data-docktab="${t}" class="${ui.docktab===t?'active':''}">${t}</button>`).join('')}</div>${content}`;}
function setups(){return `<h2>Save it. Try something new. Come back anytime.</h2><p>Looks change appearance. Dock setups also change items and behavior.</p><div class="di-saveform"><input id="di-save-name" aria-label="Setup name" value="${esc(config.name)} · My setup"><button data-action="save-setup">${ico('save')}Save current dock</button></div><div class="di-setups">${[['Everyday','Apps, notes, weather, and a clock.'],['Windows classic','Square corners and a familiar taskbar.'],...config.saved.map(s=>[s.name,'Your saved dock · Items and appearance'])].map(([n,d])=>`<section class="di-setup"><div class="di-look ${n==='Everyday'?'glass':'square'}"><i></i><i></i><i></i><i></i><i></i></div><h3 style="margin-top:10px">${esc(n)}</h3><p>${d}</p><button data-preview="${esc(n)}">Preview on this dock</button></section>`).join('')}</div>${preview?`<div class="di-review"><h2>Previewing ${esc(preview.name)}</h2><p>Your previous arrangement is safe until you choose Keep.</p><div class="di-inline"><button data-action="keep" class="primary">Keep this setup</button><button data-action="cancel">Cancel preview</button></div></div>`:''}`;}
function welcome(){return `<div class="di-welcome"><div class="di-welcome-step">Step ${ui.step+1} of 3</div>${ui.step===0?`<h1>What belongs on your desktop?</h1><p>Choose a starting dock. You can add more later.</p><div class="di-setups">${['Everyday','Windows classic'].map(n=>`<button data-role="${n}" class="di-setup ${ui.welcomeRoles.includes(n)?'active':''}" aria-pressed="${ui.welcomeRoles.includes(n)}">${ico('panels-top-left')}${n}</button>`).join('')}</div>`:ui.step===1?`<h1>Pick your first look.</h1><p>Each dock can have a theme of its own.</p>${field('Theme',opts('welcomeTheme',['Glass','Solid','Classic'],ui.welcomeTheme))}<small>You can fine-tune tint, transparency, and corners on the dock.</small>`:`<h1>A few finishing touches.</h1><p>Choose how WinDock fits into Windows.</p>${toggle('startup','Start with Windows',config.startup||false)}${toggle('taskbar','Hide the Windows taskbar',config.taskbar||false)}${field('Motion',opts('motion',['Follow Windows','Reduced motion','Full animation'],config.motion||'Follow Windows'))}<small>You’ll finish on your dock, ready to add and arrange items.</small>`}<div class="di-inline"><button data-action="back" ${ui.step===0?'disabled':''}>Back</button><button class="primary" data-action="next">${ui.step===2?'Start customizing':'Continue'}</button></div></div>`;}
function dock(){const c=config;const radius={Square:0,Soft:8,Round:16}[c.corners];const cols=['Start','Center','End'];return `<section class="di-dock-area" style="padding-bottom:${c.gap}px" aria-label="Actual dock concept"><div class="di-dock-label">${c.title==='On hover'?`<span class="di-hovertitle">${esc(c.name)} · </span>`:''}${ui.editing?`${ico('mouse-pointer-2')}Editing the actual dock · Drag to rearrange`:''}</div>${c.title==='Always'&&c.titlePlace==='Above contents'?`<div>${esc(c.name)}</div>`:''}<div class="di-dock ${ui.editing?'editing':''}" style="border-radius:${radius}px;background:color-mix(in srgb,${c.tint} ${Math.max(3,28-c.transparency/3)}%,var(--di-surface));${c.effects==='Glow'?'box-shadow:0 0 18px var(--di-accent)':''}" aria-label="Dock items">${ui.editing?`<button class="quiet di-grip" data-action="position" aria-label="Move dock and position settings">${ico('grip-vertical')}</button>`:''}${c.title==='Always'&&c.titlePlace==='Beside'?`<small>${esc(c.name)}</small>`:''}${cols.map(z=>`<div class="di-zone" data-zone="${z}" aria-label="${z} dock section">${ui.editing?`<span class="di-zone-name">${z}</span>`:''}${c.items.filter(x=>x.zone===z).map(x=>`<button class="di-slot ${ui.editing&&x.id===ui.selected?'selected':''}" draggable="${ui.editing&&!preview}" data-id="${x.id}" aria-label="${esc(x.name)} on dock" style="width:${c.size+5}px">${x.name==='Weather'?`<span class="di-temperature">☀<br>${x.units==='Celsius'?'18°':'64°'}</span>`:x.name==='Clock'?`<span class="di-clocktime">${x.timezone==='Tokyo'?'02:42':'10:42'}</span>`:ico(x.icon)}${x.name==='Clock'&&x.date!==false?'<small>Nov 8</small>':x.style==='Minimal'?'':`<small>${esc(x.name)}</small>`}</button>`).join('')||`<span class="di-empty">${ui.editing?'Drop here':''}</span>`}</div>`).join('')}${ui.editing?`<button class="di-plus" data-action="add" aria-label="Add items">+</button>`:`<button class="quiet" data-action="edit" aria-label="Customize dock">${ico('settings-2')}</button>`}</div>${!ui.editing?'<button data-action="edit">Customize this dock</button>':''}</section>`;}
function render(){if(!item())ui.selected=config.items.find(x=>x.name==='Weather')?.id||config.items[0]?.id;layout.className='di-layout '+(config.edge==='Top'?'top':['Left','Right'].includes(config.edge)?'side '+config.edge.toLowerCase():'');let panel=ui.editing?`<section class="di-panel" aria-label="Dock editor">${title()}${!ui.quickstart?`<nav class="di-tabs" aria-label="Dock editor sections">${['Add items','Dock settings','Saved setups'].map(t=>`<button data-tab="${t}" class="${ui.tab===t?'active':''}" ${preview&&t!=='Saved setups'?'disabled':''}>${t}</button>`).join('')}</nav>`:''}<div class="di-body">${ui.quickstart?welcome():ui.tab==='Add items'?addGrid():ui.tab==='Dock settings'?dockSettings():setups()}</div><footer class="di-foot"><span>${preview?'Temporary preview · Not saved':ui.quickstart?'Your preferences stay in this concept preview.':'✓ Saved in preview · Auto-hide paused while editing'}</span>${ui.quickstart?'':`<button class="quiet" data-action="session-help">Esc to finish · Ctrl+Z to undo</button>`}</footer></section>`:'';layout.innerHTML=panel+dock();const area=layout.querySelector('.di-dock-area');if(area&&!['Left','Right'].includes(config.edge)){const room=Math.max(0,(layout.clientWidth-area.offsetWidth)/2);area.style.transform='translateX('+Math.max(-room,Math.min(room,config.offset))+'px)';}status.textContent=message;if(globalThis.lucide)lucide.createIcons();}
function add(name,zone='End',before=null){const entry=catalog.find(c=>c[0]===name);if(!entry)return;const x={id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,icon:entry[1],zone};commit('Added '+name,()=>{let i=config.items.findIndex(x=>x.id===before);config.items.splice(i<0?config.items.length:i,0,x);ui.selected=x.id;});}
function move(id,zone,before){if(id===before)return;commit('Moved item to '+zone,()=>{const x=config.items.find(x=>x.id===id);if(!x)return;config.items=config.items.filter(x=>x.id!==id);x.zone=zone;let i=config.items.findIndex(x=>x.id===before);config.items.splice(i<0?config.items.length:i,0,x);ui.selected=id;});}
function moveStep(step){const x=item();if(!x)return;let peers=config.items.filter(y=>y.zone===x.zone),i=peers.indexOf(x),j=i+step;if(j<0||j>=peers.length)return;const target=peers[j];const before=step<0?target.id:peers[j+1]?.id;move(x.id,x.zone,before);}
function applySetup(name){const own=config.saved.find(x=>x.name===name);if(own){const keeps=config.saved;config={...structuredClone(own.config),saved:keeps};}else if(name==='Windows classic'){config.theme='Classic';config.corners='Square';config.size=36;config.items=[{id:'classic-start',name:'Start',icon:'panels-top-left',zone:'Start'},{id:'classic-files',name:'Files',icon:'folder',zone:'Center'},{id:'classic-clock',name:'Clock',icon:'clock-3',zone:'End'}];config.hide='Never';}else{const keeps=config.saved;config={...structuredClone(initial),saved:keeps};}ui.selected=config.items[0]?.id;}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(preview&&!['keep','cancel'].includes(d.action))return;if(d.tab){ui.tab=d.tab;ui.quickstart=false;render();persist();}else if(d.inspector){ui.inspector=d.inspector;render();persist();}else if(d.docktab){ui.docktab=d.docktab;render();persist();}else if(d.id){if(ui.editing){ui.selected=d.id;ui.tab='Add items';render();persist();}else{message='Normal mode · Widget actions resume in the real application';status.textContent=message;}}else if(d.catalog)add(d.catalog);else if(d.theme)commit('Theme: '+d.theme,()=>{config.theme=d.theme;if(d.theme==='Classic'){config.corners='Square';config.transparency=0;}if(d.theme==='Solid')config.transparency=0;if(d.theme==='Glass'){config.transparency=35;config.corners='Round';}const look=config.looks.find(x=>x.name===d.theme);if(look)Object.assign(config,look.values);});else if(d.role){ui.welcomeRoles=[d.role];render();}else if(d.preview){preview={name:d.preview,config:structuredClone(config)};applySetup(d.preview);message='Preview only. Keep or cancel to continue.';render();}else if(d.action==='undo'&&undo.length){let x=undo.pop();redo.push({config:structuredClone(config),label:x.label});config=x.config;message='Undid: '+x.label;persist();render();}else if(d.action==='redo'&&redo.length){let x=redo.pop();undo.push({config:structuredClone(config),label:x.label});config=x.config;message='Redid: '+x.label;persist();render();}else if(d.action==='remove'&&item()){const id=item().id,n=item().name;commit('Removed '+n,()=>{config.items=config.items.filter(x=>x.id!==id);ui.selected=config.items[0]?.id;});}else if(d.action==='earlier')moveStep(-1);else if(d.action==='later')moveStep(1);else if(d.action==='done'){ui.editing=false;ui.quickstart=false;message='Editing finished. Use Customize this dock to return.';persist();render();}else if(d.action==='edit'||d.action==='add'){ui.editing=true;ui.tab='Add items';message='Drag a preview onto the dock. Select an item to customize it.';render();persist();}else if(d.action==='welcome'){ui.editing=true;ui.quickstart=true;ui.step=0;render();}else if(d.action==='back'){ui.step--;render();}else if(d.action==='next'){if(ui.step<2){ui.step++;render();}else{commit('Quick start completed',()=>{config.theme=ui.welcomeTheme;ui.quickstart=false;ui.tab='Add items';});}}else if(d.action==='position'){ui.tab='Dock settings';ui.docktab='Position';render();}else if(d.action==='open-save'){ui.tab='Saved setups';render();}else if(d.action==='save-setup'){const name=root.querySelector('#di-save-name').value.trim();if(name)commit('Saved setup: '+name,()=>{const copy=structuredClone(config);copy.saved=[];const at=config.saved.findIndex(x=>x.name===name);const entry={name,config:copy};if(at>=0)config.saved[at]=entry;else config.saved.push(entry);});}else if(d.action==='keep'){const before=preview.config,label='Applied setup '+preview.name;preview=null;undo.push({config:before,label});redo=[];message=label+' · Saved in preview';persist();render();}else if(d.action==='cancel'){config=preview.config;preview=null;message='Preview canceled. Your dock is restored.';render();}else if(d.action==='save-theme'){commit('Saved look: '+config.name+' look',()=>{const name=config.name+' look';config.looks=config.looks.filter(x=>x.name!==name);config.looks.push({name,values:{tint:config.tint,transparency:config.transparency,corners:config.corners,effects:config.effects}});});}else if(d.action==='session-help'){message='Drag to move · Click to edit · Remove in inspector · Escape cancels a drag first';status.textContent=message;}});
root.addEventListener('change',e=>{const el=e.target,k=el.dataset.set;if(!k||preview)return;const val=el.type==='checkbox'?el.checked:el.type==='range'?Number(el.value):el.value;if(k==='welcomeTheme'){ui.welcomeTheme=val;return;}commit(k.startsWith('item.')?'Changed '+k.slice(5):'Changed '+k,()=>{if(k.startsWith('item.')){const x=item();if(x)x[k.slice(5)]=val;}else config[k]=val;});});
root.addEventListener('input',e=>{if(e.target.matches('.di-search')){const pos=e.target.selectionStart;ui.search=e.target.value;render();const el=root.querySelector('.di-search');el.focus();el.setSelectionRange(pos,pos);}});
function clearTargets(){root.querySelectorAll('.before,.after,.over').forEach(n=>n.classList.remove('before','after','over'));}
root.addEventListener('dragstart',e=>{if(!ui.editing||preview){e.preventDefault();return;}const el=e.target.closest('[data-catalog],[data-id]');if(!el)return;drag=el.dataset.catalog?{name:el.dataset.catalog}:{id:el.dataset.id};e.dataTransfer.setData('text/plain',JSON.stringify(drag));e.dataTransfer.effectAllowed=drag.id?'move':'copy';message='Drop between items, or into Start, Center, or End. Esc cancels.';status.textContent=message;});
root.addEventListener('dragover',e=>{const zone=e.target.closest('[data-zone]');if(!zone||!drag||preview)return;e.preventDefault();clearTargets();const slot=e.target.closest('[data-id]');if(slot){let r=slot.getBoundingClientRect();let vertical=['Left','Right'].includes(config.edge)&&root.clientWidth>600;slot.classList.add((vertical?e.clientY<r.top+r.height/2:e.clientX<r.left+r.width/2)?'before':'after');}else zone.classList.add('over');e.dataTransfer.dropEffect=drag.id?'move':'copy';});
root.addEventListener('drop',e=>{const z=e.target.closest('[data-zone]');if(!z||!drag)return;e.preventDefault();const s=e.target.closest('[data-id]');let before=s?.dataset.id;if(s?.classList.contains('after')){const peers=config.items.filter(x=>x.zone===z.dataset.zone),i=peers.findIndex(x=>x.id===before);before=peers[i+1]?.id;}const payload=drag;drag=null;clearTargets();if(payload.id)move(payload.id,z.dataset.zone,before);else add(payload.name,z.dataset.zone,before);});
root.addEventListener('dragend',()=>{drag=null;clearTargets();});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){if(drag){drag=null;clearTargets();message='Move canceled';status.textContent=message;}else if(preview){config=preview.config;preview=null;message='Preview canceled';render();}else{ui.editing=false;ui.quickstart=false;render();persist();}e.preventDefault();return;}if(e.target.matches('input,select,textarea'))return;if(e.ctrlKey&&e.key.toLowerCase()==='z'){root.querySelector('[data-action="undo"]')?.click();e.preventDefault();}if(e.ctrlKey&&e.key.toLowerCase()==='y'){root.querySelector('[data-action="redo"]')?.click();e.preventDefault();}if(ui.editing&&e.key==='Delete'){root.querySelector('[data-action="remove"]')?.click();e.preventDefault();}if(ui.editing&&e.ctrlKey&&e.key==='ArrowLeft'){moveStep(-1);e.preventDefault();}if(ui.editing&&e.ctrlKey&&e.key==='ArrowRight'){moveStep(1);e.preventDefault();}});
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState;if(s?.modelContent?.version===2){config={...config,...s.modelContent.config};Object.assign(ui,s.privateContent||{});render();}});
render();if(globalThis.Tweak){const options={drawer:'Expanded',spacing:20};const t=new Tweak({container:root,onChange:()=>{root.style.setProperty('--di-editor-gap',options.spacing+'px');root.querySelectorAll('.di-two').forEach(x=>x.style.gap=options.spacing+'px');}});t.addSlider(options,'spacing',{label:'Editor pane spacing',min:12,max:32,step:4,unit:'px'});}
})();
</script>
</div>
